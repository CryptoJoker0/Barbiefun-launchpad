openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: live-stream
    description: Public live stream configuration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /live-stream:
    get:
      operationId: getLiveStreamSettings
      tags: [live-stream]
      summary: Get the current live stream configuration
      responses:
        "200":
          description: Live stream configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStreamSettings"
    put:
      operationId: updateLiveStreamSettings
      tags: [live-stream]
      summary: Update the live stream configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveStreamSettingsInput"
      responses:
        "200":
          description: Updated live stream configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStreamSettings"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LiveStreamSettings:
      type: object
      properties:
        id:
          type: string
        isLive:
          type: boolean
        title:
          type: string
        embedUrl:
          type: [string, "null"]
          format: uri
        goLiveUrl:
          type: [string, "null"]
          format: uri
        videoObjectPath:
          type: [string, "null"]
        videoTitle:
          type: [string, "null"]
        updatedAt:
          type: string
          format: date-time
      required: [id, isLive, title, embedUrl, goLiveUrl, videoObjectPath, videoTitle, updatedAt]
    LiveStreamSettingsInput:
      type: object
      properties:
        isLive:
          type: boolean
        title:
          type: string
        embedUrl:
          type: [string, "null"]
          format: uri
        goLiveUrl:
          type: [string, "null"]
          format: uri
        videoObjectPath:
          type: [string, "null"]
        videoTitle:
          type: [string, "null"]
      required: [isLive, title]

